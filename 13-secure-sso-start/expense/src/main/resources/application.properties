# Datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/expensedb
spring.datasource.username=developer
spring.datasource.password=developer
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=drop-and-create
spring.jpa.defer-datasource-initialization=true

# OIDC / Keycloak - configure for your Keycloak instance (lab)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8888/realms/quarkus

# Application
expense.max-amount=${EXPENSE_MAX_AMOUNT:2000}
