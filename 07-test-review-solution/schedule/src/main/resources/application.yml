server:
  port: 8083

spring:
  datasource:
    url: jdbc:h2:mem:schedules
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true

---
# Prod profile: use external H2
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:h2:tcp://localhost/~/schedules
