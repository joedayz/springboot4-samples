server.port=8082

# OIDC / Keycloak
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8888/realms/quarkus

# H2
spring.datasource.url=jdbc:h2:mem:test
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=username-default
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=drop-and-create
spring.jpa.defer-datasource-initialization=true

# CORS (allowed origins for frontend)
cors.allowed-origins=http://localhost:8080,http://172.17.0.1:8080,https://localhost:8080,https://172.17.0.1:8080
