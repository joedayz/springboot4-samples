name: Validate Guides

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'tools/docs/validate_guides.py'
      - '.github/workflows/validate-guides.yml'
  push:
    paths:
      - '**/*.md'
      - 'tools/docs/validate_guides.py'
      - '.github/workflows/validate-guides.yml'
  workflow_dispatch:

jobs:
  validate-guides:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run guide validation
        run: python tools/docs/validate_guides.py

