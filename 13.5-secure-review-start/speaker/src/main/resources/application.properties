server.port=8082

# OIDC / Keycloak - same realm as Quarkus lab (backend-service client)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8888/realms/quarkus

# H2
spring.datasource.url=jdbc:h2:mem:test
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=username-default
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=drop-and-create
spring.jpa.defer-datasource-initialization=true

# CORS (dashboard on 9000 or 8080)
cors.allowed-origins=http://localhost:9000

springdoc.swagger-ui.path=/swagger-ui.html
