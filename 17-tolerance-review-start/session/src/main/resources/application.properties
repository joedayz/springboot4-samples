server.port=8081
speaker.service.url=${SPEAKER_SERVICE_URL:http://localhost:8082}

spring.datasource.url=jdbc:h2:mem:session
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.h2.console.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html

# Actuator: expose health and liveness/readiness probes
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.health.liveness.include=livenessState,serviceIsAlive
management.health.readiness.include=readinessState,serviceIsReady,db
