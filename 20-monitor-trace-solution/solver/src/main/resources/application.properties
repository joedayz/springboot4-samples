server.port=8080
adder.url=${ADDER_URL:http://localhost:8081}
multiplier.url=${MULTIPLIER_URL:http://localhost:8082}

spring.application.name=solver

# Enable distributed tracing (OTLP -> Jaeger)
management.tracing.enabled=true
management.otlp.tracing.endpoint=http://localhost:4317
management.tracing.sampling.probability=1.0

# Include trace context in console logs
logging.pattern.console=%d{HH:mm:ss} %-5level traceId=%X{traceId}, spanId=%X{spanId}, parentId=%X{parentId}, sampled=%X{sampled} [%c{2.}] (%t) %s%e%n

